name: Momentum exit research

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First portfolio decision date, YYYY-MM-DD"
        required: true
        default: "2026-03-06"
      end_date:
        description: "Last available trading date, YYYY-MM-DD"
        required: true
        default: "2026-09-04"
  push:
    branches: [main]
    paths:
      - "backtest_momentum_v3.py"
      - "tests/test_momentum_master_v3.py"
      - ".github/workflows/momentum_exit_research.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: momentum-exit-research
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests openpyxl
      - name: Syntax and unit verification
        run: |
          python -m py_compile momentum_master_v3.py backtest_momentum_v3.py
          python -m unittest discover -s tests -v
      - name: Restore backtest price cache
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: .momentum_backtest_cache.json
          key: momentum-exit-research-${{ github.run_id }}
          restore-keys: |
            momentum-exit-research-
            momentum-backtest-
      - name: Compare baseline, stop, SMA50 and momentum exits
        if: github.event_name == 'workflow_dispatch'
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          run_variant () {
            label="$1"
            shift
            python backtest_momentum_v3.py \
              --start "${{ inputs.start_date }}" \
              --end "${{ inputs.end_date }}" \
              --rebalance-months 1 "$@"
            cp Momentum_backtest_results.csv "Momentum_exit_${label}_results.csv"
            cp Momentum_backtest_summary.csv "Momentum_exit_${label}_summary.csv"
            cp Momentum_backtest_positions.csv "Momentum_exit_${label}_positions.csv"
          }
          run_variant baseline
          run_variant stop8_next_close --exit-rule stop --stop-loss-pct 8 --exit-execution next-close
          run_variant stop8_next_open --exit-rule stop --stop-loss-pct 8 --exit-execution next-open
          run_variant sma50_next_open --exit-rule sma50 --exit-execution next-open
          run_variant momentum_next_open --exit-rule momentum --exit-execution next-open
      - name: Upload exit research
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Momentum_exit_research
          path: Momentum_exit_*.csv
      - name: Publish discoverable run status
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
        run: |
          if [ "$RUN_STATUS" = "success" ]; then
            STATE=success
          else
            STATE=failure
          fi
          jq -n \
            --arg state "$STATE" \
            --arg target_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg description "Momentum exit research run ${{ github.run_id }}: $RUN_STATUS" \
            --arg context "momentum-exit-research/latest" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' \
            > status.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data @status.json
