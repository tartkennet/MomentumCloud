name: Quality historical original-file reconstruction
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['collect_quality_history.py','historical_quality_*.py','replay_quality_history.py','.github/workflows/quality_history.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: quality-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.changed.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0, persist-credentials: false}
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
          ACTION: ${{ github.event.action }}
        run: |
          python - <<'PYCODE'
          import os,subprocess
          before=os.environ.get('BEFORE','');needed=True
          if before and os.environ.get('ACTION')=='synchronize':
              files=subprocess.check_output(['git','diff','--name-only',before,'HEAD'],text=True).splitlines()
              needed=any(f in ('collect_quality_history.py','historical_quality_facts.py','historical_quality_audit.py') for f in files)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('needed='+str(needed).lower()+'\n')
          print('New original-file acquisition needed:',needed)
          PYCODE
  prepare:
    needs: scope
    if: needs.scope.outputs.needed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      dates: ${{ steps.prepare.outputs.dates }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Restore existing licensed archive and original reports
        env:
          GH_TOKEN: ${{ github.token }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          mkdir -p history_restore history_output
          timeout 120s gh release download quality-observation-41210207368-1 --repo "$GITHUB_REPOSITORY" --pattern quality_observation.tar.gz --pattern quality_manifest.json --dir history_restore
          python - <<'PY'
          import json,hashlib,tarfile,shutil
          from pathlib import Path
          p=Path('history_restore');m=json.loads((p/'quality_manifest.json').read_text())
          assert hashlib.sha256((p/'quality_observation.tar.gz').read_bytes()).hexdigest()==m['sha256']
          with tarfile.open(p/'quality_observation.tar.gz') as t:t.extractall('history_restore/base',filter='data')
          shutil.copytree(p/'base/originals','history_output/originals')
          shutil.copyfile(p/'base/base_manifest.json','history_output/base_manifest.json')
          PY
          python cache_momentum_inputs.py unseal --sealed history_restore/base/market_cache.sealed --cache-dir .history_market
          timeout 60s gh release download stocks10-research-41180905339-1 --repo "$GITHUB_REPOSITORY" --pattern results.tar.gz --pattern manifest.json --dir history_restore
          python - <<'PY'
          import tarfile
          from pathlib import Path
          with tarfile.open('history_restore/results.tar.gz') as t:
              names=[m for m in t.getmembers() if m.name.endswith('ecb-history.xml')];assert len(names)==1
              Path('history_output/ecb-history.xml').write_bytes(t.extractfile(names[0]).read())
          PY
      - id: prepare
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          timeout 2m python collect_quality_history.py prepare
          python - <<'PY'
          import os,json
          from pathlib import Path
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('dates='+json.dumps(json.loads(Path('history_output/signals.json').read_text()))+'\n')
          PY
          python cache_momentum_inputs.py seal --cache-dir .history_market --sealed history_output/market.sealed
      - uses: actions/upload-artifact@v4
        with: {name: history_prepared, path: history_output, retention-days: 2}
  panel:
    if: needs.prepare.result == 'success'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 11
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        date: ${{ fromJSON(needs.prepare.outputs.dates) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: history_prepared, path: history_output}
      - name: Restore this date's completed rows, without overwriting earlier records
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ matrix.date }}
        run: |
          python - <<'PY'
          import json,os,subprocess,tarfile
          p=subprocess.run(['gh','release','list','--repo',os.environ['GITHUB_REPOSITORY'],'--limit','100','--json','tagName'],check=True,text=True,capture_output=True)
          tags=[r['tagName'] for r in json.loads(p.stdout) if r['tagName'].startswith('quality-pit-'+os.environ['DAY']+'-')]
          if tags:
              subprocess.run(['gh','release','download',tags[0],'--repo',os.environ['GITHUB_REPOSITORY'],'--pattern','panel.tar.gz','--output','prior_panel.tar.gz'],check=True,timeout=60)
              with tarfile.open('prior_panel.tar.gz') as t:t.extractall('history_output',filter='data')
          PY
      - name: Collect actual as-filed sources in a bounded date shard
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          DAY: ${{ matrix.date }}
        run: timeout 8m python collect_quality_history.py collect --day "$DAY"
      - name: Save this completed or interrupted shard under an immutable new tag
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ matrix.date }}
        run: |
          if [ -f "history_output/$DAY.panel.json" ]; then
            tar -czf panel.tar.gz -C history_output "$DAY.panel.json" originals
            gh release create "quality-pit-$DAY-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" panel.tar.gz --repo "$GITHUB_REPOSITORY" --draft --title "Quality historical panel $DAY" --notes "Original-file acquisition timestamps remain current; publication timestamps are separate. Partial research only."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-${{ matrix.date }}
          path: history_output/${{ matrix.date }}.panel.json
          retention-days: 30
