name: Momentum BEST v2 verified experiment
on:
  workflow_dispatch:
  pull_request:
    paths: ['best_v2*.py','audit_best_v2.py','tests/test_best_v2*.py','docs/MOMENTUM10_BEST_V2_PROTOCOL.md','.github/workflows/momentum_best_v2.yml']
permissions:
  contents: read
concurrency:
  group: best-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Discover original-source capabilities without ranking or orders
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python best_v2_probe.py
