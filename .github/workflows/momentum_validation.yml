name: Trend-pullback validation

on:
  pull_request:
    paths:
      - "momentum_config.py"
      - "momentum_strategy.py"
      - "backtest_momentum_v3.py"
      - "run_trend_pullback_candidate.py"
      - "validate_production_backtest.py"
      - "data_access_preflight.py"
      - "model_validation.py"
      - "docs/TREND_PULLBACK_V1_PREREGISTRATION.md"
      - ".github/workflows/momentum_validation.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "momentum_config.py"
      - "momentum_strategy.py"
      - "backtest_momentum_v3.py"
      - "run_trend_pullback_candidate.py"
      - "validate_production_backtest.py"
      - "data_access_preflight.py"
      - "model_validation.py"
      - "docs/TREND_PULLBACK_V1_PREREGISTRATION.md"
      - ".github/workflows/momentum_validation.yml"

permissions:
  contents: read

concurrency:
  group: momentum-trend-pullback-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Point-in-time validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      START_DATE: "2023-02-01"
      END_DATE: "2026-09-25"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify historical data access
        run: python data_access_preflight.py --start "$START_DATE"
      - name: Validate preregistered trend-pullback candidate
        run: python run_trend_pullback_candidate.py --start "$START_DATE" --end "$END_DATE"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MomentumCloud_Trend_Pullback_validation
          if-no-files-found: warn
          path: |
            Momentum_backtest_results.csv
            Momentum_backtest_summary.csv
            Momentum_backtest_positions.csv
            Momentum_trend_pullback_validation_decision.json
