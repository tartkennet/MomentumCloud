name: Legacy v4 validation (manual)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Validation start, YYYY-MM-DD"
        required: true
        default: "2024-01-01"
      end_date:
        description: "Validation end, YYYY-MM-DD"
        required: true
        default: "2026-09-01"

permissions:
  contents: read

concurrency:
  group: momentum-production-validation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore locked validation cache
        uses: actions/cache/restore@v4
        with:
          path: .momentum_backtest_cache.json
          key: momentum-production-validation-v4-${{ github.run_id }}
          restore-keys: momentum-production-validation-v4-
      - name: Verify historical data access
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          set -o pipefail
          python data_access_preflight.py --start "${{ inputs.start_date || '2024-01-01' }}" 2>&1 | tee validation_preflight.log
      - name: Validate locked production model
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          set -o pipefail
          python validate_production_backtest.py --start "${{ inputs.start_date || '2024-01-01' }}" --end "${{ inputs.end_date || '2026-09-01' }}" 2>&1 | tee validation_run.log
      - name: Save verified price inputs even if validation is blocked
        if: always() && hashFiles('.momentum_backtest_cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .momentum_backtest_cache.json
          key: momentum-production-validation-v4-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MomentumCloud_Production_v1_validation
          path: |
            Momentum_backtest_results.csv
            Momentum_backtest_summary.csv
            Momentum_backtest_positions.csv
            Momentum_validation_decision.json
            Momentum_validation_data_errors.json
            validation_preflight.log
            validation_run.log
          if-no-files-found: error
