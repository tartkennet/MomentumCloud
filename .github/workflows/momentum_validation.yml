name: Production model validation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Validation start, YYYY-MM-DD"
        required: true
        default: "2021-01-01"
      end_date:
        description: "Validation end, YYYY-MM-DD"
        required: true
        default: "2026-09-01"

permissions:
  contents: read

concurrency:
  group: momentum-production-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Restore locked validation cache
        uses: actions/cache@v4
        with:
          path: .momentum_backtest_cache.json
          key: momentum-production-validation-${{ github.run_id }}
          restore-keys: momentum-production-validation-
      - name: Validate v4-balanced only
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: >-
          python validate_production_backtest.py
          --start "${{ inputs.start_date }}"
          --end "${{ inputs.end_date }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MomentumCloud_Production_v1_validation
          path: |
            Momentum_backtest_results.csv
            Momentum_backtest_summary.csv
            Momentum_backtest_positions.csv
            Momentum_validation_decision.json
