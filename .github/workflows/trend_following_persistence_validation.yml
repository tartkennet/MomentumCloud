name: Validate v4 ablation and simple momentum candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Point-in-time ablation and simple candidate validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Verify historical data access
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python data_access_preflight.py --start 2023-02-01
      - name: Run preregistered v4 ablations and simple candidate
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python run_v4_ablation_and_simple_candidate.py --start 2023-02-01
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MomentumCloud_v4_ablation_and_simple_candidate_validation
          if-no-files-found: error
          path: |
            Momentum_ablation_results.csv
            Momentum_model_review.json
            Momentum_simple_momentum_validation_decision.json
            Momentum_backtest_results.csv
            Momentum_backtest_summary.csv
            Momentum_backtest_positions.csv
