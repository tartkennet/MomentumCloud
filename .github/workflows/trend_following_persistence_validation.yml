name: Verify corrected backtest data handling

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Existing-model root-cause data audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Audit existing models without introducing a strategy
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_MAX_RETRIES: '5'
          POLYGON_RATE_LIMIT_WAIT_SECONDS: '15'
        run: python run_root_cause_data_audit.py --start 2023-02-01 --end 2026-10-03 --verification-only
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MomentumCloud_corrected_engine_verification
          if-no-files-found: error
          path: Momentum_data_audit/
