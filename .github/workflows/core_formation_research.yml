name: Fixed Core formation-risk ranking

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research_core_formation.py'
      - 'audit_core_normalized.py'
      - 'research_core_actions.py'
      - 'research_core_ledger.py'
      - 'audit_core_research_account.py'
      - 'tests/test_core_event_completions.py'
      - 'run_core_normalized_research.py'
      - 'tests/test_core_formation.py'
      - 'docs/CORE_FORMATION_RISK_PROTOCOL_20261029.md'
      - '.github/workflows/core_formation_research.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: core-formation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Restore the immutable saved inputs and completed controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen_release
          test "$(gh release view core-risk-research-20261029 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download core-risk-research-20261029 --repo "$GITHUB_REPOSITORY" --pattern Momentum_core_risk_cache.sealed --pattern Momentum_core_risk_results.tar.gz --pattern Momentum_core_risk_manifest.json --dir frozen_release
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('frozen_release')
          manifest=json.loads((root/'Momentum_core_risk_manifest.json').read_text())
          for name in ('Momentum_core_risk_cache.sealed','Momentum_core_risk_results.tar.gz'):
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==manifest['assets'][name],name
          PY
          mkdir -p saved_controls
          tar -xzf frozen_release/Momentum_core_risk_results.tar.gz -C saved_controls
      - name: Restore the completed normalized comparator without rerunning it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p normalized_reference/results
          gh release download core-normalized-research-40849825735 --repo "$GITHUB_REPOSITORY" --pattern results.tar.gz --pattern manifest.json --dir normalized_reference
          python - <<'PYREF'
          import hashlib,json
          from pathlib import Path
          root=Path('normalized_reference')
          manifest=json.loads((root/'manifest.json').read_text())
          assert manifest['source_commit']=='41952be9e54c40cb3456bd75ce13155e785a4689'
          assert hashlib.sha256((root/'results.tar.gz').read_bytes()).hexdigest()==manifest['assets']['results.tar.gz']
          PYREF
          tar -xzf normalized_reference/results.tar.gz -C normalized_reference/results
      - name: Open encrypted historical cache without a market API request
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python cache_momentum_inputs.py unseal --sealed frozen_release/Momentum_core_risk_cache.sealed
      - name: Run the one frozen candidate and separate independent checks
        run: |
          set -o pipefail
          mkdir -p formation_results
          python run_core_normalized_research.py --cache-dir .momentum_core_cache --manifest frozen_release/Momentum_core_risk_manifest.json --controls-dir saved_controls --output-dir formation_results --formation --normalized-dir normalized_reference/results 2>&1 | tee formation_results/study.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Momentum_Core_formation_evidence
          path: formation_results/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve completed or interrupted research beyond artifact expiry
        if: always() && hashFiles('formation_results/attempts.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p formation_release
          git archive --format=tar.gz HEAD > formation_release/source.tar.gz
          tar -czf formation_release/results.tar.gz -C formation_results .
          cp formation_results/attempts.json formation_release/attempts.json
          cp formation_results/report.md formation_release/report.md
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path('formation_release')
          meta={'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'workflow_run':os.environ['GITHUB_RUN_ID'],
                'input_release':'core-risk-research-20261029','live_approved':False,'broker_orders_enabled':False,
                'assets':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}}
          (root/'manifest.json').write_text(json.dumps(meta,indent=2))
          PY
          tag="core-formation-research-$GITHUB_RUN_ID"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Frozen Core formation-risk ranking $GITHUB_RUN_ID" --notes "One fixed development experiment. All cases and failures retained. Reuses immutable encrypted inputs. No live approval."
          fi
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" formation_release/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Checkpoint the result summary on the research branch
        if: always() && github.event_name == 'pull_request' && hashFiles('formation_results/report.md') != ''
        env:
          REPORT_BRANCH: ${{ github.head_ref }}
        run: |
          cp formation_results/report.md docs/CORE_FORMATION_REVIEW_20261029.md
          cp formation_results/attempts.json docs/CORE_FORMATION_RESULTS_20261029.json
          test "$(git ls-remote origin "refs/heads/$REPORT_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CORE_FORMATION_REVIEW_20261029.md docs/CORE_FORMATION_RESULTS_20261029.json
          git diff --cached --quiet && exit 0
          git commit -m "Preserve fixed formation-risk results and independent checks"
          git push origin "HEAD:refs/heads/$REPORT_BRANCH"
