name: Momentum USA quarterly candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/momentum_usa_quarterly.yml"

permissions:
  contents: read

concurrency:
  group: momentum-usa-quarterly
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests openpyxl
      - name: Syntax and unit verification
        run: |
          python -m py_compile momentum_master_v3.py backtest_momentum_v3.py
          python -m unittest discover -s tests -v
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: .momentum_backtest_cache.json
          key: momentum-usa-quarterly-${{ github.run_id }}
          restore-keys: momentum-usa-quarterly-
      - name: Run USA quarterly trend-momentum candidate
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python backtest_momentum_v3.py \
            --start "2025-10-15" \
            --end "2026-09-08" \
            --rebalance-months 3 \
            --top-n 25 \
            --exit-rule sma50 \
            --entry-execution next-open \
            --exit-execution next-open \
            --rebalance-exit-execution next-open
          cp Momentum_backtest_results.csv Momentum_USA_quarterly_results.csv
          cp Momentum_backtest_summary.csv Momentum_USA_quarterly_summary.csv
          cp Momentum_backtest_positions.csv Momentum_USA_quarterly_positions.csv
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: Momentum_USA_quarterly
          path: |
            Momentum_USA_quarterly_results.csv
            Momentum_USA_quarterly_summary.csv
            Momentum_USA_quarterly_positions.csv
