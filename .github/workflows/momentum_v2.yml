name: Momentum Cloud v2

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 4 * 3-10 1-5'      # Mar–Oct 04:00 UTC => 06:00 svensk tid
    - cron: '0 5 * 11-12,1-2 1-5' # Nov–Feb 05:00 UTC => 06:00 svensk tid

permissions:
  contents: write

jobs:
  build-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}

    steps:
            - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl requests

      - name: Fetch sectors from Polygon (cache)
        run: |
          python polygon_fetch_sectors.py

      - name: Run v2 builder (with backup)
        run: |
          set -e
          python momentum_master_v2.py



      - name: Run v2 builder (with backup)
        run: |
          set -e
          python momentum_master_v2.py

      - name: Upload artifact (Momentum.xlsx)
        uses: actions/upload-artifact@v4
        with:
          name: Momentum
          path: Momentum.xlsx
          if-no-files-found: error

      - name: Commit backup (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "backup: snapshot of Momentum mall"
          git push
