name: BEST foreign material source capability
on:
  pull_request:
    paths: ['tools/probe_best_foreign.py','best_v2_mirrors.py','data/filing_mirrors.json','.github/workflows/best_foreign_source_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify actual foreign form coverage without orders or clearance
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: PYTHONPATH=. python tools/probe_best_foreign.py

      - name: Verify issuer copy identity and all filing exhibits
        run: python best_v2_mirrors.py
