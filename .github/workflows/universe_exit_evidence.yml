name: Collect unresolved universe exit evidence
on:
  pull_request:
    branches: [main]
    paths:
      - collect_universe_exit_evidence.py
      - universe_unresolved_tickers.json
      - .github/workflows/universe_exit_evidence.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Collect individual raw and adjusted histories
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          CHUNK_INDEX: ${{ matrix.chunk }}
          POLYGON_MAX_RETRIES: '5'
          POLYGON_RATE_LIMIT_WAIT_SECONDS: '15'
        run: python collect_universe_exit_evidence.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-exit-evidence-${{ matrix.chunk }}
          path: Momentum_universe_exit_evidence/
          if-no-files-found: error
