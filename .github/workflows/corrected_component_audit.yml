name: Controlled existing-model component audit
on:
  pull_request:
    branches: [main]
    paths:
      - run_corrected_component_audit.py
      - .github/workflows/corrected_component_audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read existing corrected baselines from this private repository
        uses: actions/download-artifact@v4
        with:
          name: MomentumCloud_corrected_engine_verification
          run-id: 37380437479
          github-token: ${{ github.token }}
          path: audit_corrected
      - name: Restore frozen input and successful checkpoints from this private repository
        uses: actions/download-artifact@v4
        with:
          name: MomentumCloud_corrected_component_audit
          run-id: 37419651430
          github-token: ${{ github.token }}
          path: .
      - name: Verify component accounting tests
        run: python -m unittest discover -s tests
      - name: Run fixed component diagnostics with frozen provider responses
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_MAX_RETRIES: '5'
          POLYGON_RATE_LIMIT_WAIT_SECONDS: '15'
        run: python run_corrected_component_audit.py
      - name: Retain results and reproducible input snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MomentumCloud_corrected_component_audit
          if-no-files-found: error
          include-hidden-files: true
          path: |
            Momentum_component_audit/
