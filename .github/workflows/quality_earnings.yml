name: Quality and Earnings current source collection
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['quality_sources.py','quality_fundamentals.py','quality_strategy.py','quality_audit.py','collect_quality.py','docs/QUALITY_EARNINGS_PROTOCOL_20261031.md','.github/workflows/quality_earnings.yml']
permissions:
  # Draft release download requires repository push scope; original releases
  # are strictly read-only. Results use a NEW unique draft tag.
  contents: write
  actions: read
concurrency:
  group: quality-collection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      replay: ${{ steps.changed.outputs.replay }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        name: Avoid repeating approved replay for presentation-only commits
        env:
          BEFORE: ${{ github.event.before }}
          ACTION: ${{ github.event.action }}
        run: |
          python - <<'PY'
          import os,subprocess
          files={'quality_sources.py','quality_fundamentals.py','quality_strategy.py','quality_audit.py','collect_quality.py','docs/QUALITY_EARNINGS_PROTOCOL_20261031.md','.github/workflows/quality_earnings.yml'}
          replay=True
          before=os.environ.get('BEFORE','')
          if os.environ.get('ACTION')=='synchronize' and before and set(before)!={'0'}:
              result=subprocess.run(['git','diff','--name-only',before,'HEAD'],capture_output=True,text=True)
              if result.returncode==0:
                  replay=bool(files.intersection(result.stdout.splitlines()))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('replay='+str(replay).lower()+'\n')
          print('Replay required:',replay)
          PY
  study:
    needs: scope
    if: needs.scope.outputs.replay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_quality*.py' -v
      - name: Restore existing authenticated price inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p quality_restore
          timeout 90s gh release download core-risk-research-20261029 --repo "$GITHUB_REPOSITORY" --pattern Momentum_core_risk_cache.sealed --pattern Momentum_core_risk_manifest.json --dir quality_restore
          python - <<'PYCODE'
          import json,hashlib
          from pathlib import Path
          p=Path('quality_restore');m=json.loads((p/'Momentum_core_risk_manifest.json').read_text())
          assert hashlib.sha256((p/'Momentum_core_risk_cache.sealed').read_bytes()).hexdigest()==m['assets']['Momentum_core_risk_cache.sealed']
          PYCODE
      - name: Unseal into a separate Quality price cache
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python cache_momentum_inputs.py unseal --sealed quality_restore/Momentum_core_risk_cache.sealed --cache-dir .quality_market_cache
      - name: Observe original reports, current universe and independent checks
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p quality_output quality_fundamentals_cache
          set -o pipefail
          timeout 8m python collect_quality.py --cache .quality_market_cache --manifest quality_restore/Momentum_core_risk_manifest.json --fundamentals quality_fundamentals_cache --output quality_output 2>&1 | tee quality_output/collection.log
      - name: Preserve original SEC files without modifying earlier observations
        if: always()
        run: |
          cp -r quality_fundamentals_cache quality_output/originals
          cp quality_restore/Momentum_core_risk_manifest.json quality_output/base_manifest.json
      - name: Seal the licensed market cache
        if: always()
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python cache_momentum_inputs.py seal --cache-dir .quality_market_cache --sealed quality_output/market_cache.sealed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Quality_current_observation
          path: quality_output/
          retention-days: 90
      - name: Archive this observation under a new immutable tag
        if: always() && hashFiles('quality_output/quality.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf quality_observation.tar.gz -C quality_output .
          python - <<'PYCODE'
          import hashlib,json,subprocess,os
          from pathlib import Path
          p=Path('quality_observation.tar.gz')
          Path('quality_manifest.json').write_text(json.dumps({'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run':os.environ['GITHUB_RUN_ID'],'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'broker_orders_enabled':False}))
          PYCODE
          tag="quality-observation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" quality_observation.tar.gz quality_manifest.json --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --draft --title "Quality current observation $GITHUB_RUN_ID" --notes "Actual observed original filings and market inputs; no fabricated historical returns or trades."
