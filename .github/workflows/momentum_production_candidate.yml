name: Momentum production candidate validation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First portfolio decision date, YYYY-MM-DD"
        required: true
        default: "2025-10-15"
      end_date:
        description: "Last available trading date, YYYY-MM-DD"
        required: true
        default: "2026-09-04"
permissions:
  contents: read
  statuses: write

concurrency:
  group: momentum-production-candidate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START_DATE: ${{ github.event.inputs.start_date || '2025-10-15' }}
      END_DATE: ${{ github.event.inputs.end_date || '2026-09-04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Verify all unit tests
        run: |
          python -m py_compile momentum_master_v3.py backtest_momentum_v3.py
          python -m unittest discover -s tests -v
      - name: Restore reusable price cache
        uses: actions/cache@v4
        with:
          path: .momentum_backtest_cache.json
          key: momentum-production-candidate-${{ github.run_id }}
          restore-keys: |
            momentum-production-candidate-
            momentum-walk-forward-
            momentum-robustness-
            momentum-exit-research-
            momentum-backtest-
      - name: Validate exact proposed production configuration
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python backtest_momentum_v3.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --rebalance-months 1 \
            --top-n 15 \
            --exit-rule stop \
            --stop-loss-pct 6 \
            --entry-execution next-open \
            --exit-execution next-open \
            --rebalance-exit-execution next-open
          cp Momentum_backtest_results.csv Momentum_production_candidate_results.csv
          cp Momentum_backtest_summary.csv Momentum_production_candidate_summary.csv
          cp Momentum_backtest_positions.csv Momentum_production_candidate_positions.csv
          python - <<'PY'
          import pandas as pd

          summary = pd.read_csv("Momentum_production_candidate_summary.csv").iloc[0]
          expected = {
              "RebalanceMonths": 1,
              "TopN": 15,
              "ExitRule": "stop",
              "StopLoss_pct": 6.0,
              "EntryExecution": "next-open",
              "ExitExecution": "next-open",
              "RebalanceExitExecution": "next-open",
          }
          for key, value in expected.items():
              if summary[key] != value:
                  raise RuntimeError(f"Configuration mismatch for {key}: {summary[key]} != {value}")
          if summary["Universe"] != "CURRENT_TEMPLATE_SURVIVORSHIP_BIAS":
              raise RuntimeError("Universe limitation label is missing")
          print("Exact top-15 production candidate configuration verified")
          PY
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: Momentum_production_candidate
          path: Momentum_production_candidate_*.csv
      - name: Publish discoverable run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
        run: |
          if [ "$RUN_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          jq -n \
            --arg state "$STATE" \
            --arg target_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg description "Momentum production candidate ${{ github.run_id }}: $RUN_STATUS" \
            --arg context "momentum-production-candidate/latest" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' > status.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data @status.json
