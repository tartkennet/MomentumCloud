name: Momentum legacy v1 comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backtest_momentum_v3.py"
      - "momentum_master_v3.py"
      - "tests/test_backtest_configuration_v3.py"
      - "tests/test_momentum_master_v3.py"
      - ".github/workflows/momentum_legacy_comparison.yml"

permissions:
  contents: read

concurrency:
  group: momentum-legacy-comparison
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      POLYGON_MAX_RETRIES: "12"
      POLYGON_RATE_LIMIT_WAIT_SECONDS: "45"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Restore reusable price cache
        uses: actions/cache@v4
        with:
          path: .momentum_backtest_cache.json
          key: momentum-legacy-comparison-${{ github.run_id }}
          restore-keys: |
            momentum-production-candidate-
            momentum-walk-forward-
            momentum-robustness-
            momentum-exit-research-
            momentum-backtest-
      - name: Refresh TPC history on one adjusted Polygon basis
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from momentum_master_v3 import PolygonClient

          # The reusable cache can span Polygon adjustment revisions. Refresh
          # every TPC session for this research window from one adjusted daily
          # aggregate response, so entries and exits cannot mix price bases.
          client = PolygonClient(os.environ["POLYGON_API_KEY"])
          data = client._get(
              "/v2/aggs/ticker/TPC/range/1/day/2025-09-01/2026-09-04",
              {"adjusted": "true", "limit": 50000},
          )
          rows = {
              datetime.fromtimestamp(int(item["t"]) / 1000, tz=timezone.utc).date().isoformat(): item
              for item in data.get("results", [])
              if item.get("o") is not None and item.get("h") is not None
              and item.get("l") is not None and item.get("c") is not None
              and item.get("v") is not None
          }
          if not rows:
              raise RuntimeError("Polygon returned no adjusted TPC daily history")
          path = Path(".momentum_backtest_cache.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          sessions = payload.get("sessions", {})
          refreshed = 0
          for day, prices in rows.items():
              if day not in sessions:
                  continue
              sessions[day]["TPC"] = {
                  "open": float(prices["o"]),
                  "high": float(prices["h"]),
                  "low": float(prices["l"]),
                  "close": float(prices["c"]),
                  "volume": float(prices["v"]),
              }
              refreshed += 1
          if refreshed < 100:
              raise RuntimeError(f"Refreshed only {refreshed} TPC sessions")
          path.write_text(json.dumps(payload, separators=(",", ":")), encoding="utf-8")
          print(f"Refreshed {refreshed} TPC sessions from one adjusted Polygon response")
          PY
      - name: Compare verified legacy v1 with current v3
        run: |
          set -euo pipefail
          run_variant() {
            label="$1"
            model="$2"
            stop="$3"
            python backtest_momentum_v3.py \
              --start 2025-10-15 \
              --end 2026-09-04 \
              --rebalance-months 1 \
              --top-n 15 \
              --selection-model "$model" \
              --exit-rule stop \
              --stop-loss-pct "$stop" \
              --entry-execution next-open \
              --exit-execution next-open \
              --rebalance-exit-execution next-open
            cp Momentum_backtest_summary.csv "Momentum_legacy_${label}_summary.csv"
            cp Momentum_backtest_results.csv "Momentum_legacy_${label}_results.csv"
            cp Momentum_backtest_positions.csv "Momentum_legacy_${label}_positions.csv"
          }
          run_variant legacy_v1_stop8 legacy-v1 8
          run_variant legacy_v1_stop6 legacy-v1 6
          run_variant current_v3_stop6 v3 6
      - name: Build and validate comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          files = sorted(Path('.').glob('Momentum_legacy_*_summary.csv'))
          rows = []
          for path in files:
              row = pd.read_csv(path).iloc[0].to_dict()
              row['Variant'] = path.name.removeprefix('Momentum_legacy_').removesuffix('_summary.csv')
              rows.append(row)
          comparison = pd.DataFrame(rows)
          expected = {'legacy_v1_stop8', 'legacy_v1_stop6', 'current_v3_stop6'}
          assert set(comparison['Variant']) == expected
          assert set(comparison['TopN']) == {15}
          assert set(comparison['RebalanceMonths']) == {1}
          assert set(comparison['EntryExecution']) == {'next-open'}
          assert set(comparison['ExitExecution']) == {'next-open'}
          assert set(comparison['RebalanceExitExecution']) == {'next-open'}
          assert set(comparison['Universe']) == {'CURRENT_TEMPLATE_SURVIVORSHIP_BIAS'}
          comparison.to_csv('Momentum_legacy_comparison.csv', index=False)
          print(comparison[['Variant', 'SelectionModel', 'StopLoss_pct', 'TotalReturn_pct', 'SPYTotalReturn_pct', 'TotalEdgeVsSPY_pct', 'DailyMaxDrawdown_pct']].to_string(index=False))
          PY
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Momentum_legacy_comparison
          path: |
            Momentum_legacy_*.csv
          if-no-files-found: warn
          retention-days: 30
