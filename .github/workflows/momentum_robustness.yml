name: Momentum robustness research

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First portfolio decision date, YYYY-MM-DD"
        required: true
        default: "2025-10-15"
      end_date:
        description: "Last available trading date, YYYY-MM-DD"
        required: true
        default: "2026-09-04"
  push:
    branches: [main]
    paths:
      - "robustness_report_v3.py"
      - "tests/test_robustness_report_v3.py"
      - ".github/workflows/momentum_robustness.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: momentum-robustness
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      START_DATE: ${{ github.event.inputs.start_date || '2025-10-15' }}
      END_DATE: ${{ github.event.inputs.end_date || '2026-09-04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests openpyxl
      - name: Syntax and unit verification
        run: |
          python -m py_compile momentum_master_v3.py backtest_momentum_v3.py robustness_report_v3.py
          python -m unittest discover -s tests -v
      - name: Restore reusable price cache
        uses: actions/cache@v4
        with:
          path: .momentum_backtest_cache.json
          key: momentum-robustness-${{ github.run_id }}
          restore-keys: |
            momentum-robustness-
            momentum-exit-research-
            momentum-backtest-
      - name: Run maximum provider-window exit sensitivity research
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          run_variant () {
            label="$1"
            shift
            python backtest_momentum_v3.py \
              --start "$START_DATE" \
              --end "$END_DATE" \
              --rebalance-months 1 "$@"
            cp Momentum_backtest_results.csv "Momentum_robustness_${label}_results.csv"
            cp Momentum_backtest_summary.csv "Momentum_robustness_${label}_summary.csv"
            cp Momentum_backtest_positions.csv "Momentum_robustness_${label}_positions.csv"
          }
          run_variant baseline
          run_variant stop6_next_open --exit-rule stop --stop-loss-pct 6 --exit-execution next-open
          run_variant stop8_next_open --exit-rule stop --stop-loss-pct 8 --exit-execution next-open
          run_variant stop10_next_open --exit-rule stop --stop-loss-pct 10 --exit-execution next-open
          run_variant stop12_next_open --exit-rule stop --stop-loss-pct 12 --exit-execution next-open
          run_variant sma50_next_open --exit-rule sma50 --exit-execution next-open
          python robustness_report_v3.py
      - name: Upload robustness report
        uses: actions/upload-artifact@v4
        with:
          name: Momentum_robustness
          path: Momentum_robustness_*.csv
      - name: Publish discoverable run status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_STATUS: ${{ job.status }}
        run: |
          if [ "$RUN_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          jq -n \
            --arg state "$STATE" \
            --arg target_url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg description "Momentum robustness run ${{ github.run_id }}: $RUN_STATUS" \
            --arg context "momentum-robustness/latest" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' > status.json
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data @status.json
