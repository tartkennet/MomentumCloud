name: Momentum Daily

on:
  schedule:
    - cron: "0 4 * * 1-5"   # 04:00 UTC = 06:00 Stockholm (vardagar)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch incremental
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          
                   - name: Debug – list sheets in template (before build)
        run: |
          python - << 'PY'
          from openpyxl import load_workbook
          import os
          print("CWD:", os.getcwd())
          wb = load_workbook("Momentum_template.xlsx")
          print("TEMPLATE sheets:", wb.sheetnames)
          PY
 run: python polygon_fetch_incremental.py

      - name: Build Momentum.xlsx
            - name: Debug – list sheets in output (after build)
        run: |
          python - << 'PY'
          from openpyxl import load_workbook
          wb = load_workbook("Momentum.xlsx")
          print("OUTPUT sheets:", wb.sheetnames)
          PY

        run: python momentum_master.py

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: Momentum.xlsx
          path: Momentum.xlsx
          if-no-files-found: error
