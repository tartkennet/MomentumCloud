name: Momentum Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1-5"   # 06:00 svensk tid (vardagar)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl pyarrow requests

      - name: Fetch incremental (create/extend cache.parquet)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python polygon_fetch_incremental.py

      - name: Build raw Momentum.xlsx (all sheets)
        run: |
          python momentum_master.py

      - name: Merge data into your template
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from openpyxl.utils import get_column_letter
          import pandas as pd, math
          from pathlib import Path

          RAW = Path("Momentum.xlsx")
          TEMPLATE = Path("Momentum mall fil.xlsx")
          OUT = Path("Momentum.xlsx")

          if not TEMPLATE.exists():
              raise FileNotFoundError("Hittar inte 'Momentum mall fil.xlsx'.")

          auto_tabs = ["Universe", "Calc", "BuyNow", "EarlyCandidates"]
          dfs = {}
          with pd.ExcelFile(RAW) as x:
              for sh in auto_tabs:
                  try:
                      dfs[sh] = pd.read_excel(x, sheet_name=sh)
                  except:
                      dfs[sh] = pd.DataFrame()

          wb = load_workbook(TEMPLATE)

          def write_df(ws, df):
              ws.delete_rows(2, ws.max_row)
              for j,c in enumerate(df.columns,start=1):
                  ws.cell(row=1,column=j).value=c
              for i,row in enumerate(df.itertuples(index=False),start=2):
                  for j,val in enumerate(row,start=1):
                      ws.cell(row=i,column=j).value=None if (isinstance(val,float) and math.isnan(val)) else val

          for sh,df in dfs.items():
              if sh not in wb.sheetnames:
                  wb.create_sheet(sh)
              ws = wb[sh]

              if sh=="BuyNow" and not df.empty:
                  # Procentkolumner
                  for col in [c for c in df.columns if str(c).startswith("Ret_")]:
                      if pd.api.types.is_numeric_dtype(df[col]):
                          s=df[col].dropna().astype(float)
                          if not s.empty and s.median()>5: df[col]=df[col]/100
                          df[col]=df[col].round(4)
                  # Övriga numeriska
                  for col in df.columns:
                      if not str(col).startswith("Ret_") and pd.api.types.is_numeric_dtype(df[col]):
                          df[col]=df[col].round(2)

              write_df(ws,df)

              if sh=="BuyNow" and not df.empty:
                  headers={ (ws.cell(row=1,column=j).value or ""):j for j in range(1,ws.max_column+1)}
                  for name,j in headers.items():
                      for r in range(2,ws.max_row+1):
                          cell=ws.cell(row=r,column=j)
                          if str(name).startswith("Ret_"): cell.number_format="0.00%"
                          elif isinstance(cell.value,(int,float)): cell.number_format="0.00"
                  for name,j in headers.items():
                      l=get_column_letter(j)
                      if ws.column_dimensions[l].width in (None,0):
                          ws.column_dimensions[l].width=max(9,min(25,len(str(name))+2))

          wb.save(OUT)
          PY

      - name: Apply filters and add QtyToBuy
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from math import floor

          xlsx="Momentum.xlsx"
          wb=load_workbook(xlsx)
          if "BuyNow" not in wb.sheetnames:
              wb.save(xlsx); exit()

          ws=wb["BuyNow"]
          headers={ (c.value or "").strip():c.column for c in ws[1] if c.value }
          def col(n): return headers.get(n)
          c_price=col("Price_0"); c_sma200=col("SMA200")
          c_r3=col("Ret_3m"); c_r6=col("Ret_6m"); c_vol=col("AvgVol")

          # --- mild filter ---
          for r in range(ws.max_row,1,-1):
              try:
                  p=float(ws.cell(r,c_price).value)
                  s=float(ws.cell(r,c_sma200).value)
                  r6=float(ws.cell(r,c_r6).value)
                  ok=(p>s) and (r6>0)
                  if c_r3:
                      r3=float(ws.cell(r,c_r3).value)
                      ok=ok and (r3>0)
                  if c_vol:
                      v=ws.cell(r,c_vol).value
                      if v: ok=ok and (float(v)>=300000)
              except: ok=False
              if not ok: ws.delete_rows(r,1)

          # --- qty from Parametrar ---
          capital=None
          if "Parametrar" in wb.sheetnames:
              ps=wb["Parametrar"]
              for r in ps.iter_rows(values_only=True):
                  if not r or not r[0]: continue
                  if str(r[0]).strip().lower().startswith("kapital"):
                      try: capital=float(r[1]); break
                      except: pass

          if capital and capital>0:
              hdrs=[(c.value or "").strip() for c in ws[1]]
              if "QtyToBuy" not in hdrs:
                  ws.cell(1,len(hdrs)+1).value="QtyToBuy"
                  c_qty=len(hdrs)+1
              else:
                  c_qty=hdrs.index("QtyToBuy")+1
              n=max(1,ws.max_row-1)
              per_stock=capital/n
              if c_price:
                  for r in range(2,ws.max_row+1):
                      price=ws.cell(r,c_price).value
                      try: ws.cell(r,c_qty).value=floor(per_stock/float(price))
                      except: ws.cell(r,c_qty).value=None

          wb.save(xlsx)
          PY

      - name: Upload Momentum.xlsx
        uses: actions/upload-artifact@v4
        with:
          name: Momentum
          path: Momentum.xlsx
