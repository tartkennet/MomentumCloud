name: Momentum Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1-5"   # 04:00 UTC = 06:00 svensk tid (vardagar)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl pyarrow requests

      - name: Fetch incremental (create/extend cache.parquet)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python polygon_fetch_incremental.py

      - name: Debug – list sheets in template (before build)
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook("Momentum_template.xlsx")
          print("TEMPLATE sheets:", wb.sheetnames)
          PY

      - name: Build Momentum.xlsx
        run: |
          python momentum_master.py

      - name: Debug – list sheets in output (after build)
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          wb = load_workbook("Momentum.xlsx")
          print("OUTPUT sheets:", wb.sheetnames)
          PY

      - name: Upload artifact (Momentum.xlsx)
        uses: actions/upload-artifact@v4
        with:
          name: Momentum
          path: Momentum.xlsx
