name: Momentum Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1-5"   # 06:00 svensk tid (vardagar)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl pyarrow requests

      - name: Fetch incremental (create/extend cache.parquet)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python polygon_fetch_incremental.py

      - name: Build raw Momentum.xlsx (all sheets)
        run: |
          python momentum_master.py

      # --------- NYTT: slå ihop med din mall och skriv bara automationsflikarna ---------
      - name: Merge into your template (keep manual sheets)
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from openpyxl.utils import get_column_letter
          import pandas as pd
          from pathlib import Path

          RAW = Path("Momentum.xlsx")                       # filen som byggts
          TEMPLATE = Path("Momentum mall fil.xlsx")         # DIN mallfil i repot (med dina färger/format)
          OUT = Path("Momentum.xlsx")                       # vi skriver tillbaka hit

          if not TEMPLATE.exists():
              raise FileNotFoundError("Hittar inte 'Momentum mall fil.xlsx' i repo-roten.")

          # Läs data från de automationsflikar som ska skrivas om
          auto_tabs = ["Universe","Calc","BuyNow","EarlyCandidates"]
          dfs = {}
          with pd.ExcelFile(RAW) as x:
              for sh in auto_tabs:
                  try:
                      dfs[sh] = pd.read_excel(x, sheet_name=sh)
                  except Exception:
                      dfs[sh] = pd.DataFrame()

          # Öppna din mall och skriv IN bara auto-flikarna, behåll allt annat
          wb = load_workbook(TEMPLATE)

          for sh, df in dfs.items():
              if sh in wb.sheetnames:
                  ws = wb[sh]
              else:
                  ws = wb.create_sheet(sh)

              # Rensa rader under rubrik (behåll rubrikradens format)
              ws.delete_rows(2, ws.max_row)

              # Skriv rubriker (A1..)
              ws.cell(row=1, column=1).value = df.columns[0] if len(df.columns)>0 else "Ticker"
              for j, col in enumerate(df.columns, start=1):
                  ws.cell(row=1, column=j).value = col

              # Skriv värden rad/kolumn, bibehåller cellformat som finns
              for i, row in enumerate(df.itertuples(index=False), start=2):
                  for j, val in enumerate(row, start=1):
                      ws.cell(row=i, column=j).value = val

              # (Valfritt) auto-bredd om kolumnen saknar width i mallen
              for j, col in enumerate(df.columns, start=1):
                  letter = get_column_letter(j)
                  if ws.column_dimensions[letter].width in (None, 0):
                      ws.column_dimensions[letter].width = max(9, min(30, len(str(col))+2))

          # Spara som slutfil (skriver alltså över RAW med din mall + nya auto-flikar)
          wb.save(OUT)
          PY
      # -------------------------------------------------------------------------------

      - name: Upload Momentum.xlsx
        uses: actions/upload-artifact@v4
        with:
          name: Momentum
          path: Momentum.xlsx
