import numpy as np
import pandas as pd
from openpyxl import load_workbook
from openpyxl.utils import get_column_letter

# === BUY NOW ===

# 1️⃣ Konvertera numeriska kolumner till float
for c in ["Price", "SMA200", "Ret_1m", "Ret_3m", "Ret_6m", "Ret_12m"]:
    if c in base.columns:
        base[c] = pd.to_numeric(base[c], errors="coerce")

# 2️⃣ Säkerställ att returer är i decimalform
for c in ["Ret_1m", "Ret_3m", "Ret_6m", "Ret_12m"]:
    if c in base.columns:
        base[c] = base[c].where(base[c].abs() <= 1, base[c] / 100.0)

# 3️⃣ Momentum-filter (utan volymkrav)
flt_core = (
    (base["Price"] > base["SMA200"].fillna(np.inf)) &
    (base["Ret_3m"].fillna(-1) > 0) &
    (base["Ret_6m"].fillna(-1) > 0)
)
cand = base.loc[flt_core].copy()

# 4️⃣ Rangordna på ScoreAdj (eller Score, MomentumScore, Ret_6m)
rank_cols = [c for c in ["ScoreAdj", "Score", "MomentumScore", "Ret_6m"] if c in base.columns]
rank_col = rank_cols[0]
top_core = cand.sort_values(rank_col, ascending=False).head(15).copy()

# 5️⃣ Fyll upp till 15 om färre
need = 15 - len(top_core)
if need > 0:
    trend = base.loc[(base["Price"] > base["SMA200"].fillna(np.inf))].copy()
    trend = trend[~trend["Ticker"].isin(top_core["Ticker"])]
    filler = trend.sort_values(rank_col, ascending=False).head(need)
    buy_now_df = pd.concat([top_core, filler], ignore_index=True)
else:
    buy_now_df = top_core

buy_now_df = buy_now_df.dropna(subset=["Ticker"]).drop_duplicates(subset=["Ticker"]).head(15).copy()

# 6️⃣ BuyRank / BuyFlag
buy_now_df.insert(0, "BuyRank", np.arange(1, len(buy_now_df) + 1))
buy_now_df["BuyFlag"] = buy_now_df["BuyRank"] <= 10

# 7️⃣ Läs Kapital från Parametrar
def load_params_dict():
    try:
        dfp = pd.read_excel(mall_path, sheet_name="Parametrar")
        kv = dfp.iloc[:, :2].copy()
        kv.columns = ["key", "value"]
        kv["key_norm"] = kv["key"].astype(str).str.strip().str.lower()
        return dict(zip(kv["key_norm"], kv["value"]))
    except Exception:
        return {}

params = load_params_dict()
capital = 0.0
for k in ["kapital att handla för", "kapital", "kapital_att_handla_for"]:
    if k in params:
        try:
            capital = float(params[k])
            break
        except Exception:
            pass

per_ticker_budget = (capital / 10.0) if capital > 0 else 0.0

# 8️⃣ QtyToBuy endast för topp 10
buy_now_df["QtyToBuy"] = 0
if "Price" in buy_now_df.columns and per_ticker_budget > 0:
    mask_top10 = buy_now_df["BuyRank"] <= 10
    buy_now_df.loc[mask_top10, "QtyToBuy"] = np.floor(
        per_ticker_budget / buy_now_df.loc[mask_top10, "Price"].replace(0, np.nan)
    ).fillna(0).astype(int)

# 9️⃣ Ret_1m–Ret_12m till procent med två decimaler
for c in ["Ret_1m", "Ret_3m", "Ret_6m", "Ret_12m"]:
    if c in buy_now_df.columns:
        buy_now_df[c] = (buy_now_df[c] * 100).round(2)

# 🔟 Runda alla numeriska kolumner till två decimaler
num_cols = buy_now_df.select_dtypes(include=[np.number]).columns
buy_now_df[num_cols] = buy_now_df[num_cols].round(2)

# 🔁 Sortera på BuyRank 1–15
buy_now_df = buy_now_df.sort_values("BuyRank").reset_index(drop=True)

# 1️⃣1️⃣ Skriv BuyNow till Excel (Universe lämnas orörd)
with pd.ExcelWriter(out_path, engine="openpyxl", mode="a", if_sheet_exists="replace") as xw:
    buy_now_df.to_excel(xw, sheet_name="BuyNow", index=False)

# 1️⃣2️⃣ Formatera i Excel: procent och två decimaler
wb = load_workbook(out_path)
ws = wb["BuyNow"]

headers = [cell.value for cell in ws[1]]
for c in ["Ret_1m", "Ret_3m", "Ret_6m", "Ret_12m"]:
    if c in headers:
        col_idx = headers.index(c) + 1
        for row in ws.iter_rows(min_row=2, min_col=col_idx, max_col=col_idx):
            for cell in row:
                cell.number_format = "0.00%"

for idx, name in enumerate(headers, start=1):
    if name not in ["Ret_1m", "Ret_3m", "Ret_6m", "Ret_12m"]:
        for row in ws.iter_rows(min_row=2, min_col=idx, max_col=idx):
            for cell in row:
                if isinstance(cell.value, (int, float)):
                    cell.number_format = "0.00"

wb.save(out_path)
