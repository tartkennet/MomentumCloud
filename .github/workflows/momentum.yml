name: Momentum Cloud

on:
  workflow_dispatch: {}
  schedule:
    # Kör 06:00 svensk tid på vardagar.
    # Mar–Oct (CEST): 04:00 UTC  => 06:00 lokal tid
    - cron: '0 4 * 3-10 1-5'
    # Nov–Feb (CET):  05:00 UTC  => 06:00 lokal tid
    - cron: '0 5 * 11-12,1-2 1-5'

permissions:
  contents: read

concurrency:
  group: momentum-cloud
  cancel-in-progress: false

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (optional)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run momentum_master.py
        run: |
          set -e
          python momentum_master.py

      - name: Verify output exists
        run: |
          test -f Momentum.xlsx || (echo "Momentum.xlsx saknas" && exit 1)

      - name: Upload artifact (Momentum.xlsx)
        uses: actions/upload-artifact@v4
        with:
          name: Momentum
          path: Momentum.xlsx
          if-no-files-found: error
