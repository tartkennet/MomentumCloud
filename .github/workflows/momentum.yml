name: Momentum Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1-5"   # 06:00 svensk tid (vardagar)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl pyarrow requests

      - name: Fetch incremental (create/extend cache.parquet)
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python polygon_fetch_incremental.py

      - name: Build Momentum.xlsx
        run: |
          python momentum_master.py

      - name: Post-process sheets (Holdings OK/KÖP + format Calc/BuyNow)
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          from openpyxl.styles import PatternFill
          from openpyxl.worksheet.worksheet import Worksheet

          xlsx = "Momentum.xlsx"
          wb = load_workbook(xlsx)

          # ---------- A) Holdings: ta bort färg + visa OK/KÖP ----------
          if "Holdings" in wb.sheetnames:
              ws: Worksheet = wb["Holdings"]

              # 1) Ta bort villkorsstyrd formatering
              try:
                  ws.conditional_formatting._cf_rules.clear()
              except Exception:
                  ws.conditional_formatting = type(ws.conditional_formatting)()

              # 2) Ta bort cellfärger
              for row in ws.iter_rows():
                  for c in row:
                      if c.fill is not None:
                          c.fill = PatternFill(fill_type=None)

              # 3) 1/0 -> OK/KÖP via number format (behåller formler)
              header_row = 1
              headers = { (cell.value or "").strip(): cell.column for cell in ws[header_row] if cell.value }
              def apply_fmt(col_name, fmt):
                  if col_name in headers:
                      col = headers[col_name]
                      for r in range(header_row+1, ws.max_row+1):
                          ws.cell(row=r, column=col).number_format = fmt

              ok_fmt  = '[=1]"OK";[=0]"";General'
              kop_fmt = '[=1]"KÖP";[=0]"";General'
              for name in ("FundOK","TrendOK","MomentumOK"):
                  apply_fmt(name, ok_fmt)
              apply_fmt("KÖP?", kop_fmt)

          # ---------- B
      - name: Upload Momentum.xlsx
        uses: actions/upload-artifact@v4
        with:
          name: Momentum
          path: Momentum.xlsx
