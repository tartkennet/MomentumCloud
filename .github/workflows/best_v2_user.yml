name: BEST v2 unified user paper account
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['best_v2_user*.py','audit_best_v2_user.py','data/best-v2-user-start.json','.github/workflows/best_v2_user.yml','verify_best_v2_production.py','api/best-v2.js','public/best-v2*','public/index.html']
  pull_request:
    paths: ['best_v2_user*.py','audit_best_v2_user.py','data/best-v2-user-start.json','.github/workflows/best_v2_user.yml','tests/test_best_v2_user.py']
  schedule:
    - cron: '12,32,52 13-20 * * 1-5'
    - cron: '20 20,21 * * 1-5'
    - cron: '22 8 * * 1-5'
permissions:
  contents: write
  actions: read
concurrency:
  group: best-v2-user-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  account:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright==1.56.0
      - run: python -m unittest discover -s tests -p 'test_best_v2_user.py' -v
      - run: python best_v2_user_browser.py
      - name: Restore verified prices and the separate BEST account
        env:
          GH_TOKEN: ${{ github.token }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          mkdir -p best_v2_restore best_v2_previous best_v2_output
          python - <<'PY'
          import subprocess,json,hashlib,tarfile,shutil,os
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          def gh(*args):subprocess.run(['gh',*args,'--repo',repo],check=True,timeout=120)
          branch='best-v2-observed-snapshots';prior=None
          if git('ls-remote','--heads','origin','refs/heads/'+branch):
              git('fetch','--no-tags','origin','refs/heads/'+branch)
              prior=json.loads(git('show','FETCH_HEAD:best-v2-current-manifest.json'))
              gh('release','download',prior['release_tag'],'--pattern','best_v2_observation.tar.gz','--dir','best_v2_restore')
              archive=Path('best_v2_restore/best_v2_observation.tar.gz');assert hashlib.sha256(archive.read_bytes()).hexdigest()==prior['sha256']
              with tarfile.open(archive) as t:t.extractall('best_v2_previous',filter='data')
              cache_meta=prior;cache_release='best-v2-paper-inputs-v1'
          else:
              git('fetch','--no-tags','origin','refs/heads/best-observed-snapshots')
              cache_meta=json.loads(git('show','FETCH_HEAD:best-current-manifest.json'))
              cache_release='best-paper-inputs-v1'
          gh('release','download',cache_release,'--pattern',cache_meta['cache_asset'],'--output','best_v2_restore/cache.sealed')
          assert hashlib.sha256(Path('best_v2_restore/cache.sealed').read_bytes()).hexdigest()==cache_meta['cache_sha256']
          Path('best_v2_restore/previous-manifest.json').write_text(json.dumps(prior))
          PY
          if test -f best_v2_recovery/cache.sealed; then python cache_momentum_inputs.py unseal --sealed best_v2_recovery/cache.sealed --cache-dir .best_v2_market_cache; fi
          python cache_momentum_inputs.py unseal --sealed best_v2_restore/cache.sealed --cache-dir .best_v2_market_cache
      - uses: actions/cache/restore@v4
        with:
          path: best_user_recovery
          key: best-user-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: best-user-inputs-
      - name: Restore the distinct user simulation without writing the original journal
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          mkdir -p best_user_previous best_user_output
          if git ls-remote --exit-code --heads origin refs/heads/best-v2-user-snapshots; then
            git fetch --no-tags origin refs/heads/best-v2-user-snapshots
            git show FETCH_HEAD:best-v2-state.json > best_user_previous/best-v2-state.json
            git show FETCH_HEAD:public/data/momentum-best-v2.json > best_user_previous/best-v2-report.json
          fi
          if test -f best_user_recovery/cache.sealed; then python cache_momentum_inputs.py unseal --sealed best_user_recovery/cache.sealed --cache-dir .best_v2_market_cache; fi
      - name: Run the one followed simulation with independent initialization and forward audits
        env:
          GH_TOKEN: ${{ github.token }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python best_v2_user.py --cache .best_v2_market_cache --formation best_v2_previous --previous best_user_previous --output best_user_output
      - name: Preserve encrypted incremental inputs
        if: always()
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          mkdir -p best_user_recovery
          python cache_momentum_inputs.py seal --cache-dir .best_v2_market_cache --sealed best_user_recovery/cache.sealed
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: best_user_recovery
          key: best-user-inputs-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: User_paper_verification
          path: best_user_output/
      - name: Publish immutable user observations, including explicit collection failure
        if: always() && github.event_name != 'pull_request'
        run: |
          python - <<'PYTHON'
          import os,json,hashlib,subprocess
          from pathlib import Path
          p=Path('best_user_output/best-v2-report.json')
          if not p.exists():raise SystemExit('NO_USER_ACCOUNT_REPORT_TO_PUBLISH')
          meta=dict(source_commit=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'],sha256=hashlib.sha256(p.read_bytes()).hexdigest(),live_approved=False,broker_orders_enabled=False)
          Path('best_user_manifest.json').write_text(json.dumps(meta))
          PYTHON
          python best_v2_user_publish.py --folder best_user_output --manifest best_user_manifest.json
      - name: Verify production user account, main views and mobile
        if: success() && github.event_name != 'pull_request'
        run: |
          python -m pip install playwright==1.56.0
          python verify_best_v2_production.py
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: User_paper_production_checks
          path: best_v2_production_check/
