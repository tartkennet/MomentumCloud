name: Quality historical offline replay and independent audit
on:
  workflow_dispatch:
    inputs:
      collect_supplements:
        description: 'Complete SEC gaps and replay separately, preserving all original results'
        type: boolean
        default: false
      source_archive_commit:
        description: 'Optional full SHA containing verified transfer chunks, when SEC denies runner access'
        type: string
        default: ''
      source_archive_sha256:
        description: 'Required SHA256 of transferred source archive'
        type: string
        default: ''
  pull_request:
    branches: [main]
    paths: ['evaluate_historical_quality.py','audit_quality_history_account.py','.github/workflows/evaluate_quality_history.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: quality-history-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.changed.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', fetch-depth: 0, persist-credentials: false}
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
          ACTION: ${{ github.event.action }}
        run: |
          python - <<'PYCODE'
          import os,subprocess
          before=os.environ.get('BEFORE','');needed=True
          if before and os.environ.get('ACTION')=='synchronize':
              files=subprocess.check_output(['git','diff','--name-only',before,'HEAD'],text=True).splitlines()
              needed=any(f in ('evaluate_historical_quality.py','audit_quality_history_account.py','tests/test_historical_quality.py','.github/workflows/evaluate_quality_history.yml') for f in files)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('needed='+str(needed).lower()+'\n')
          print('New offline computation needed:',needed)
          PYCODE
  replay:
    needs: scope
    if: needs.scope.outputs.needed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha || github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_historical_quality.py' -v
      - name: Restore completed inputs instead of repeating acquisition
        env:
          GH_TOKEN: ${{ github.token }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          mkdir -p history_saved history_output
          timeout 120s gh release download quality-history-41234365835-1 --repo "$GITHUB_REPOSITORY" --pattern historical_results.tar.gz --pattern market.sealed --dir history_saved
          python - <<'PY'
          import shutil,json,hashlib,tarfile
          from pathlib import Path
          with tarfile.open('history_saved/historical_results.tar.gz') as t:t.extractall('history_saved/results',filter='data')
          saved=Path('history_saved/results');m=json.loads((saved/'input_assets.json').read_text())
          sealed=Path('history_saved/market.sealed')
          assert hashlib.sha256(sealed.read_bytes()).hexdigest()==m['history_output/market.sealed']
          shutil.copyfile(sealed,'history_output/market.sealed')
          for p in (saved/'inputs').iterdir():
              assert p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==m['history_results/inputs/'+p.name]
              shutil.copyfile(p,Path('history_output')/p.name)
          dates=json.loads(Path('history_output/signals.json').read_text())
          assert all((Path('history_output')/(d+'.panel.json')).exists() for d in dates)
          print('Restored immutable original panels:',dates)
          PY
          mkdir -p archived_fx
          timeout 60s gh release download stocks10-research-41180905339-1 --repo "$GITHUB_REPOSITORY" --pattern results.tar.gz --pattern manifest.json --dir archived_fx
          python - <<'PY'
          import hashlib,json,tarfile
          from pathlib import Path
          p=Path('archived_fx');m=json.loads((p/'manifest.json').read_text());raw=(p/'results.tar.gz').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==m['assets']['results.tar.gz']
          with tarfile.open(p/'results.tar.gz') as t:
              member=next(m for m in t.getmembers() if m.name.endswith('ecb-history.xml'))
              assert t.extractfile(member).read()==Path('history_output/ecb-history.xml').read_bytes()
          PY
          python cache_momentum_inputs.py unseal --sealed history_output/market.sealed --cache-dir .history_market
      - uses: actions/checkout@v4
        if: inputs.source_archive_commit != ''
        with:
          ref: ${{ inputs.source_archive_commit }}
          path: source_transfer_checkout
          sparse-checkout: .quality-source-transfer
          persist-credentials: false
      - name: Restore verified source transport without reacquisition
        if: inputs.source_archive_commit != ''
        env:
          ARCHIVE_SHA256: ${{ inputs.source_archive_sha256 }}
        run: |
          python - <<'PY'
          import hashlib,os,tarfile,re
          from pathlib import Path
          expected=os.environ['ARCHIVE_SHA256'];assert re.fullmatch(r'[a-f0-9]{64}',expected)
          raw=b''.join(p.read_bytes() for p in sorted(Path('source_transfer_checkout/.quality-source-transfer').glob('part-*')))
          assert hashlib.sha256(raw).hexdigest()==expected
          Path('source_completion.tar.gz').write_bytes(raw)
          with tarfile.open('source_completion.tar.gz') as t:t.extractall('source_saved/verified',filter='data')
          PY
      - name: Collect bounded SEC source supplements and reproduce them offline
        if: github.event_name == 'workflow_dispatch' && inputs.collect_supplements
        run: |
          if ! test -f source_saved/verified/source-review.json; then
            timeout --preserve-status 8m python supplement_quality_sources.py --panels history_output --output source_saved/verified
          fi
          python supplement_quality_sources.py --panels history_output --output source_saved/verified --apply-to history_supplemented
      - uses: actions/upload-artifact@v4
        if: always() && inputs.collect_supplements
        with: {name: Quality_SEC_source_completion, path: source_saved/verified/, retention-days: 90}
      - name: Reconcile saved source archive and replay without network
        env:
          COLLECT_SUPPLEMENTS: ${{ inputs.collect_supplements }}
        run: |
          timeout 2m python - <<'PY'
          import os
          from run_core_normalized_research import verify_inputs
          from pathlib import Path
          import socket
          from evaluate_historical_quality import run
          verify_inputs(Path('.history_market'),'history_output/base_manifest.json')
          socket.socket=lambda *a,**k:(_ for _ in ()).throw(RuntimeError('Historical replay must be offline'))
          root='history_supplemented' if os.environ.get('COLLECT_SUPPLEMENTS')=='true' else 'history_output'
          run('.history_market',root,'history_results')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: Quality_historical_results, path: history_results/, retention-days: 90}
      - name: Preserve verified results separately from all paper accounts
        if: always() && hashFiles('history_results/quality-history.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p history_results/inputs
          source=history_output
          if test -d history_supplemented; then source=history_supplemented; fi
          cp "$source"/*.json history_results/inputs/
          cp history_output/ecb-history.xml history_results/inputs/
          if test -f source_saved/verified/source-review.json; then cp source_saved/verified/source-review.json history_results/; fi
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          files=[Path('history_output/market.sealed')]+list(Path('history_results/inputs').iterdir())
          Path('history_results/input_assets.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}))
          PY
          tar -czf historical_results.tar.gz -C history_results .
          extras=()
          if test -d source_saved/verified; then
            tar -czf source_completion.tar.gz -C source_saved/verified .
            extras+=(source_completion.tar.gz)
          fi
          gh release create "quality-history-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" historical_results.tar.gz history_output/market.sealed "${extras[@]}" --repo "$GITHUB_REPOSITORY" --draft --title "Quality historical conditional results $GITHUB_RUN_ID" --notes "Separate development reconstruction. Original publications audited; historical SIC vintage remains uncertified. No historical or live GO."
