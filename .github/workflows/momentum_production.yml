name: Legacy v4 snapshots (manual)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: momentum-production-v1
  cancel-in-progress: true

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore price and corporate-action caches
        uses: actions/cache@v4
        with:
          path: |
            .momentum_history_cache.json
            .momentum_splits_cache.json
            .momentum_security_master.json
          key: momentum-production-v1-${{ github.run_id }}
          restore-keys: momentum-production-v1-
      - name: Verify code before data access
        run: |
          python -m py_compile momentum_config.py momentum_strategy.py momentum_production.py momentum_master_v3.py update_paper_portfolio.py
          python -m unittest discover -s tests -v
      - name: Locate latest completed main validation
        id: validation
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'momentum_validation.yml',
              branch: 'main', status: 'completed', per_page: 1
            });
            const run = data.workflow_runs[0];
            if (!run || run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
            const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo, run_id: run.id
            });
            if (artifacts.artifacts.some(a => a.name === 'MomentumCloud_Production_v1_validation' && !a.expired)) {
              core.setOutput('run_id', String(run.id));
            }
      - name: Discard unverified checkout decision
        run: rm -f Momentum_validation_decision.json
      - name: Download validation evidence
        if: steps.validation.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: MomentumCloud_Production_v1_validation
          run-id: ${{ steps.validation.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .validation
      - name: Load decision for source verification
        if: steps.validation.outputs.run_id != ''
        run: |
          if [ -f .validation/Momentum_validation_decision.json ]; then
            cp .validation/Momentum_validation_decision.json Momentum_validation_decision.json
          fi
      - name: Build verified production snapshot
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          POLYGON_MAX_RETRIES: "6"
          POLYGON_RATE_LIMIT_WAIT_SECONDS: "65"
        run: |
          set -o pipefail
          python momentum_production.py 2>&1 | tee momentum_run.log
          python update_paper_portfolio.py 2>&1 | tee -a momentum_run.log
      - name: Validate product outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from openpyxl import load_workbook
          from momentum_production import validate_payload

          payload = json.loads(Path("public/data/dashboard.json").read_text())
          validate_payload(payload)
          wb = load_workbook("Momentum.xlsx", data_only=True, read_only=True)
          required = {"BuyNow", "Kandidater", "Holdings", "Signals", "Diagnostics"}
          missing = required.difference(wb.sheetnames)
          if missing:
              raise RuntimeError(f"Missing workbook sheets: {sorted(missing)}")
          approved = bool(payload.get("model_validation", {}).get("approved"))
          buy_now_count = len(payload["buy_now"])
          if payload["risk"]["status"] == "RISK ON":
              if approved and not 1 <= buy_now_count <= 15:
                  raise RuntimeError("Approved RISK ON model requires 1-15 eligible Buy Now rows")
              if not approved and buy_now_count != 0:
                  raise RuntimeError("Unapproved model must not publish Buy Now rows")
          paper = payload.get("paper_portfolio", {})
          if paper.get("status") != "ACTIVE":
              raise RuntimeError("Paper portfolio is not active")
          print(f"Verified {payload['market_date']}: {len(payload['buy_now'])} Buy Now, {len(payload['candidates'])} candidates; paper {paper.get('market_date')}")
          PY
      - name: Write run report
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          log = Path("momentum_run.log").read_text(errors="replace")[-12000:] if Path("momentum_run.log").exists() else "No production log was created."
          Path("Momentum_last_run.md").write_text(
              "# MomentumCloud Production v1\n\n"
              f"Result: {os.environ['JOB_STATUS'].upper()}\n\n"
              f"Updated UTC: {datetime.now(timezone.utc).isoformat()}\n\n"
              "Model: v4-balanced · 55% 12–2 momentum · 20% 6–2 momentum · 15% low volatility · 10% low extension · 15 equal weights · monthly · ADV20 5M USD · stop 10% · SPY>SMA200\n\n"
              "Current limitation: survivorship bias\n\n"
              "## Log tail\n\n```text\n" + log + "\n```\n",
              encoding="utf-8",
          )
          PY
      - name: Publish verified snapshot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Momentum.xlsx .momentum_production_state.json
          git add Momentum_buy_history.csv Momentum_signals.csv Momentum_last_run.md Momentum_paper_portfolio.json public/data/dashboard.json public/data/buynow.json
          git diff --cached --quiet || git commit -m "Publish MomentumCloud Production v1 snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MomentumCloud_Production_v1
          path: |
            Momentum.xlsx
            Momentum_buy_history.csv
            Momentum_signals.csv
            Momentum_last_run.md
            public/data/dashboard.json
            Momentum_paper_portfolio.json
            momentum_run.log
            Momentum_validation_decision.json
          if-no-files-found: warn
