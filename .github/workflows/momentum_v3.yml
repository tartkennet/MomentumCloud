name: Momentum v3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/momentum_v3.yml'
      - 'momentum_master_v3.py'
      - 'Momentum mall fil.xlsx'
      - 'tests/**'
  schedule:
    # Weekdays 12:00 UTC (~before US market open depending on DST)
    - cron: '0 12 * * 1-5'

permissions:
  contents: write

concurrency:
  group: momentum-v3-main
  cancel-in-progress: true

jobs:
  run-momentum-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests openpyxl

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee momentum_run.log

      - name: Run momentum v3
        id: momentum
        if: steps.unit_tests.outcome == 'success'
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          set -o pipefail
          python momentum_master_v3.py 2>&1 | tee -a momentum_run.log

      - name: Validate generated workbook
        id: workbook_validation
        if: steps.unit_tests.outcome == 'success' && steps.momentum.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          from openpyxl import load_workbook

          wb = load_workbook("Momentum.xlsx", data_only=True)
          for name in ("BuyNow", "Kandidater", "Diagnostics", "DebugTickers"):
              if name not in wb.sheetnames:
                  raise RuntimeError(f"Missing worksheet: {name}")

          def rows_and_scores(sheet_name):
              ws = wb[sheet_name]
              headers = [cell.value for cell in ws[1]]
              rank_col = headers.index("Rank") + 1
              score_col = headers.index("TotalScore") + 1
              rows = [row for row in range(2, ws.max_row + 1) if ws.cell(row, rank_col).value is not None]
              ranks = [ws.cell(row, rank_col).value for row in rows]
              scores = [ws.cell(row, score_col).value for row in rows]
              if ranks != list(range(1, len(rows) + 1)):
                  raise RuntimeError(f"{sheet_name} ranks are not consecutive")
              if any(a < b for a, b in zip(scores, scores[1:])):
                  raise RuntimeError(f"{sheet_name} is not sorted by TotalScore descending")
              return len(rows)

          buy_count = rows_and_scores("BuyNow")
          candidate_count = rows_and_scores("Kandidater")
          if not 1 <= buy_count <= 15:
              raise RuntimeError(f"BuyNow must have 1-15 rows, got {buy_count}")
          if candidate_count < buy_count:
              raise RuntimeError("Kandidater must contain at least the BuyNow rows")
          print(f"Workbook verified: BuyNow={buy_count}, Kandidater={candidate_count}")
          PY

      - name: Write run status
        if: always()
        env:
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          MOMENTUM: ${{ steps.momentum.outcome }}
          WORKBOOK_VALIDATION: ${{ steps.workbook_validation.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          outcomes = {
              "Unit tests": os.environ.get("UNIT_TESTS", "skipped"),
              "Momentum run": os.environ.get("MOMENTUM", "skipped"),
              "Workbook validation": os.environ.get("WORKBOOK_VALIDATION", "skipped"),
          }
          success = all(value == "success" for value in outcomes.values())
          log_path = Path("momentum_run.log")
          log_tail = log_path.read_text(errors="replace")[-12000:] if log_path.exists() else "No run log was created."
          lines = [
              "# Momentum v3 last run",
              "",
              f"Overall result: {'SUCCESS' if success else 'FAILED'}",
              "",
          ]
          lines.extend(f"- {name}: {value}" for name, value in outcomes.items())
          lines.extend(["", "## Log tail", "", "```text", log_tail, "```", ""])
          Path("Momentum_last_run.md").write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Commit verified output and status
        if: always()
        env:
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          MOMENTUM: ${{ steps.momentum.outcome }}
          WORKBOOK_VALIDATION: ${{ steps.workbook_validation.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Momentum_last_run.md
          if [ "$UNIT_TESTS" = "success" ] && [ "$MOMENTUM" = "success" ] && [ "$WORKBOOK_VALIDATION" = "success" ]; then
            git add Momentum.xlsx
          fi
          git diff --cached --quiet || git commit -m "Record Momentum v3 run status"
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Momentum_v3
          path: |
            Momentum.xlsx
            Momentum_last_run.md
            momentum_run.log
          if-no-files-found: warn

      - name: Mark workflow failed when checks fail
        if: always()
        env:
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          MOMENTUM: ${{ steps.momentum.outcome }}
          WORKBOOK_VALIDATION: ${{ steps.workbook_validation.outcome }}
        run: |
          test "$UNIT_TESTS" = "success"
          test "$MOMENTUM" = "success"
          test "$WORKBOOK_VALIDATION" = "success"
