name: Fixed Core risk research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research_core_stop.py'
      - 'research_core_trailing.py'
      - 'run_core_risk_research.py'
      - 'audit_core_risk_research.py'
      - 'tests/test_core_stop_research.py'
      - 'tests/test_core_trailing_research.py'
      - 'docs/CORE_STOP10_PROTOCOL_20261029.md'
      - 'docs/CORE_RISK_V2_PROTOCOL_20261029.md'
      - '.github/workflows/core_risk_research.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: fixed-core-risk-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  research:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: '1'
      POLYGON_MAX_RETRIES: '8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify original and candidate mechanics
        run: python -m unittest discover -s tests -v
      - name: Restore immutable encrypted research inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=core-risk-research-20261029
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/risk_release_draft"; then
            test "$(cat "$RUNNER_TEMP/risk_release_draft")" = true
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern Momentum_core_risk_cache.sealed --output .momentum_core_cache.sealed
          fi
      - name: Bootstrap immutable inputs from the completed same-PR cache
        if: hashFiles('.momentum_core_cache.sealed') == ''
        uses: actions/cache/restore@v4
        with:
          path: .momentum_core_cache.sealed
          key: core-risk-sealed-40788221889
          fail-on-cache-miss: true
      - name: Open saved input cache
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python cache_momentum_inputs.py unseal
      - name: Retrieve the immutable original baseline evidence
        uses: actions/download-artifact@v4
        with:
          name: Momentum_Core_evidence
          run-id: 40772049150
          github-token: ${{ github.token }}
          path: .risk_baseline
      - name: Fixed historical experiment and separately reported extension
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          mkdir -p risk_v2_results
          set -o pipefail
          python run_core_risk_research.py \
            --cache-dir .momentum_core_cache \
            --baseline-dir .risk_baseline/core_results \
            --output-dir risk_v2_results \
            --end 2026-10-28 --offline 2>&1 | tee risk_v2_results/study.log
      - name: Seal reusable input cache
        if: always() && hashFiles('.momentum_core_cache/**/*.gz') != ''
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python cache_momentum_inputs.py seal
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.momentum_core_cache.sealed') != ''
        with:
          path: .momentum_core_cache.sealed
          key: core-risk-sealed-${{ github.run_id }}
      - name: Preserve the complete frozen research package without cache expiry
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=core-risk-research-20261029
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | contains(["Momentum_core_risk_cache.sealed", "Momentum_core_risk_source.tar.gz", "Momentum_core_risk_results.tar.gz", "Momentum_core_risk_manifest.json"])' > "$RUNNER_TEMP/risk_release_complete"; then
            if [ "$(cat "$RUNNER_TEMP/risk_release_complete")" = true ]; then exit 0; fi
          fi
          mkdir -p risk_release
          cp .momentum_core_cache.sealed risk_release/Momentum_core_risk_cache.sealed
          git archive --format=tar.gz HEAD > risk_release/Momentum_core_risk_source.tar.gz
          tar -czf risk_release/Momentum_core_risk_results.tar.gz -C risk_v2_results .
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('risk_release')
          cache = Path('.momentum_core_cache')
          result = {'source_commit': os.environ['GITHUB_SHA'], 'workflow_run': os.environ['GITHUB_RUN_ID'],
                    'live_approved': False, 'raw_inputs_encrypted': True, 'input_files': {}, 'assets': {}}
          for p in sorted(cache.rglob('*')):
              if p.is_file():
                  assert not p.is_symlink()
                  result['input_files'][str(p.relative_to(cache))] = hashlib.sha256(p.read_bytes()).hexdigest()
          for p in sorted(root.iterdir()):
              result['assets'][p.name] = hashlib.sha256(p.read_bytes()).hexdigest()
          (root / 'Momentum_core_risk_manifest.json').write_text(json.dumps(result, indent=2))
          PY
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "Core fixed-risk frozen research 2026-10-29" \
              --notes "Encrypted saved inputs, exact source and all results. No API credential is stored. Historical research only; no live approval. Private raw-data copies are also retained for offline replay without an active subscription."
          fi
          gh release upload "$tag" risk_release/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Preserve encrypted inputs and exact study source
        if: always() && hashFiles('risk_v2_results/**/Momentum_core_decision.json') != ''
        run: |
          mkdir -p risk_private
          decision=$(python -c "from pathlib import Path; print(sorted(Path('risk_v2_results').rglob('Momentum_core_decision.json'))[0])")
          python archive_momentum_inputs.py --cache-dir .momentum_core_cache \
            --decision "$decision" --output "$RUNNER_TEMP/core_risk_inputs.tar.gz"
          openssl cms -encrypt -aes-256-cbc -binary -outform DER \
            -in "$RUNNER_TEMP/core_risk_inputs.tar.gz" -out risk_private/core_risk_inputs.p7m \
            docs/validation_archive_recipient.pem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Momentum_Core_fixed_risk_v2_evidence
          path: risk_v2_results/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('risk_private/core_risk_inputs.p7m') != ''
        with:
          name: Momentum_Core_fixed_risk_v2_private_inputs
          path: risk_private/core_risk_inputs.p7m
          if-no-files-found: error
          retention-days: 90
