name: Fixed Core risk-normalized ranking

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research_core_normalized.py'
      - 'audit_core_normalized.py'
      - 'run_core_normalized_research.py'
      - 'tests/test_core_normalized.py'
      - 'docs/CORE_RISK_NORMALIZED_PROTOCOL_20261029.md'
      - '.github/workflows/core_normalized_research.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: core-normalized-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Restore the immutable saved inputs and completed controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen_release
          test "$(gh release view core-risk-research-20261029 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download core-risk-research-20261029 --repo "$GITHUB_REPOSITORY" --pattern Momentum_core_risk_cache.sealed --pattern Momentum_core_risk_results.tar.gz --pattern Momentum_core_risk_manifest.json --dir frozen_release
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('frozen_release')
          manifest=json.loads((root/'Momentum_core_risk_manifest.json').read_text())
          for name in ('Momentum_core_risk_cache.sealed','Momentum_core_risk_results.tar.gz'):
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==manifest['assets'][name],name
          PY
          mkdir -p saved_controls
          tar -xzf frozen_release/Momentum_core_risk_results.tar.gz -C saved_controls
      - name: Open encrypted historical cache without a market API request
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python cache_momentum_inputs.py unseal --sealed frozen_release/Momentum_core_risk_cache.sealed
      - name: Run the one frozen candidate and separate independent checks
        run: |
          set -o pipefail
          mkdir -p normalized_results
          python run_core_normalized_research.py --cache-dir .momentum_core_cache --manifest frozen_release/Momentum_core_risk_manifest.json --controls-dir saved_controls --output-dir normalized_results 2>&1 | tee normalized_results/study.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Momentum_Core_normalized_evidence
          path: normalized_results/
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve completed or interrupted research beyond artifact expiry
        if: always() && hashFiles('normalized_results/attempts.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p normalized_release
          git archive --format=tar.gz HEAD > normalized_release/source.tar.gz
          tar -czf normalized_release/results.tar.gz -C normalized_results .
          cp normalized_results/attempts.json normalized_release/attempts.json
          cp normalized_results/report.md normalized_release/report.md
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('normalized_release')
          meta={'source_commit':os.environ['GITHUB_SHA'],'workflow_run':os.environ['GITHUB_RUN_ID'],
                'input_release':'core-risk-research-20261029','live_approved':False,'broker_orders_enabled':False,
                'assets':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}}
          (root/'manifest.json').write_text(json.dumps(meta,indent=2))
          PY
          tag="core-normalized-research-$GITHUB_RUN_ID"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY"; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Frozen Core normalized ranking $GITHUB_RUN_ID" --notes "One fixed development experiment. All cases and failures retained. Reuses immutable encrypted inputs. No live approval."
          fi
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" normalized_release/* --repo "$GITHUB_REPOSITORY" --clobber
      - name: Checkpoint the result summary on the research branch
        if: always() && github.event_name == 'pull_request' && hashFiles('normalized_results/report.md') != ''
        env:
          REPORT_BRANCH: ${{ github.head_ref }}
        run: |
          cp normalized_results/report.md docs/CORE_NORMALIZED_REVIEW_20261029.md
          cp normalized_results/attempts.json docs/CORE_NORMALIZED_RESULTS_20261029.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CORE_NORMALIZED_REVIEW_20261029.md docs/CORE_NORMALIZED_RESULTS_20261029.json
          git diff --cached --quiet && exit 0
          git commit -m "Preserve fixed normalized-ranking results and independent checks"
          git push origin "HEAD:refs/heads/$REPORT_BRANCH"
